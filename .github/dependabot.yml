version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    
    # 【关键】数量设为 0，禁止自动创建 PR，只保留后台扫描和警报功能
    open-pull-requests-limit: 0
    
    # 确保开启安全更新检查（虽然不自动提 PR，但需要它更新漏洞库）
    groups:
      # 可选：将依赖分组以便管理，但不影响扫描逻辑
      all-npm:
        patterns:
          - "*"
