version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily" # 每天扫描一次
      time: "09:00"
      timezone: "Asia/Shanghai"
    
    # 【核心配置】设置为 0，禁止自动创建 Pull Request
    open-pull-requests-limit: 0
    
    # 可选：添加标签，方便在 Security 面板筛选
    labels:
      - "security-alert"
      - "npm-dependencies"
    
    # 可选：忽略某些非关键依赖的告警，避免邮件轰炸
    # ignore:
    #   - dependency-name: "dev-only-package"
    #     update-types: ["version-update:semver-patch"]
