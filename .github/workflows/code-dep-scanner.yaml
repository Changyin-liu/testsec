name: Dependency Security Gate

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'

# 权限设置：需要读取内容和写入 PR 评论（可选），以及读取安全检查数据
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        id: dep_review
        uses: actions/dependency-review-action@v4
        with:
          # 配置严格模式：只要有任何程度的漏洞都失败
          # 可选值: low, moderate, high, critical
          fail-on-severity: low 
          
          # 生成报告文件，方便后续步骤读取发邮件
          # 默认会在 github workspace 生成 dependency-review.md 和 json 数据
          comment-summary-in-pr: always 
          
          # 如果需要忽略某些特定的 CVE (误报情况)，可以在这里配置
          # ignore-cves: CVE-2023-XXXXX

      # --- 以下步骤仅在上面的检查失败时执行 (即发现了漏洞) ---
      
      - name: Process Vulnerability Report & Send Email
        if: failure() && steps.dep_review.outcome == 'failure'
        run: |
          echo "有漏洞"
          exit 1
