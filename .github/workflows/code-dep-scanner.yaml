name: Dependency Security Gate

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'

# 权限设置：需要读取代码和写入 PR 评论
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 【核心配置】只要发现 low (低危) 及以上级别的漏洞，立即让任务失败
          # 可选值: low, moderate, high, critical
          fail-on-severity: low 
          
          # 在 PR 下方自动评论详细的漏洞报告（方便开发者知道哪个包有问题）
          comment-summary-in-pr: always
          
          # (可选) 如果是私有包或特定误报，可以在这里忽略，目前先不开启
          # ignore-cves: CVE-XXXX-XXXXX
